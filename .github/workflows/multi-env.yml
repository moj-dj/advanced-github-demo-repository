name: Multi-Environment Workflow

on:
  push:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "Deploying to DEV"

  deploy-staging:
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - run: echo "Deploying to STAGE"

  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - run: echo "Deploying to PROD"
