name: Multi-Stage Testing Workflow

on:
  push:
    branches: [ "main" ]
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building the project..."

  test-1:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Running tests (1)..."

  test-2:
    runs-on: ubuntu-latest
    needs: test-1
    steps:
      - run: echo "Running tests (2)..."
